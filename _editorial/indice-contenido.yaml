# Índice de contenidos de la sección Personas
#
# Una entrada por página. Lo usan:
#  - herramientas/generar_faq.py: genera un bloque reutilizable de preguntas frecuentes por tema
#    (.gitbook/includes/faq-<tema>.md) con las páginas de tipo «pregunta» o «concepto» de ese tema.
#  - el análisis de enlaces por intención: «resuelve» dice qué problema resuelve cada página o ancla.
#  - herramientas/validar.py: comprueba que el índice y las páginas coinciden.
#
# tipo: portada | tarea | concepto | pregunta | referencia
# temas: temas a los que pertenece la página (una pregunta puede tener varios)
# faq_tema: tema del bloque de preguntas frecuentes que muestra la página (solo tareas)
# resuelve: intenciones que resuelve la página; «ancla» vacía = la página entera

temas:
  acceso: Alta y acceso
  citas: Citas
  justificantes: Justificantes de asistencia
  historia-clinica: Historia clínica
  episodios: Episodios médicos
  pruebas: Pruebas diagnósticas
  informes: Informes
  documentacion: Documentación
  segunda-opinion: Segunda opinión médica
  prestaciones: Prestaciones económicas
  pago-directo: Pago directo
  rel: Riesgo durante el embarazo o la lactancia
  pagos: Pagos y retenciones
  autoliquidacion: Autoliquidación
  chat: Chat con el servicio médico
  videoconsulta: Videoconsulta
  rehabilitacion: Rehabilitación online

