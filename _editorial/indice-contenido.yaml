  alta: {url: "https://soporte-ibermutua-digital.scroll.site/soporte-ibermutua-digital/tu-alta-y-acceso-a-ibermutua-digital-personas", intencion: darse de alta y acceder a Ibermutua Digital Personas}
  alta-app: {url: "https://soporte-ibermutua-digital.scroll.site/soporte-ibermutua-digital/alta-a-traves-de-la-app", intencion: darse de alta en la app}
