# Mapa de contenido de la sección Personas
#
# Fuente de tres cosas (las demás están en indice-contenido.yaml):
#  - de qué páginas de Confluence sale cada página (origen);
#  - qué otras páginas debe enlazar cada una y por qué (relaciones);
#  - el catálogo de bloques reutilizables y de variables: contenido, origen y estado.
# Nació como plan de migración de las 82 páginas; desde el 01-02/10 todas están migradas. Una página nueva lleva
# aquí su entrada (origen y relaciones) y, en el índice, su tipo, temas, intenciones y preguntas.
# Lo que se consulta en help-center no se repite aquí. Dónde se usa un bloque: grep -rn "includes/<nombre>.md" help-center.
#   Dónde se usa una variable: fila de vars.yaml del README del repositorio.
#
# origen: páginas de Confluence (Pnn = orden de extracciones/…/indice.md). La primera es la
#   principal; las demás se fusionan o se redirigen a esta página (ver correspondencia.csv).
# relaciones: qué otras páginas debe enlazar esta y por qué. No dicen dónde va el enlace: lo decide
#   la redacción con las reglas 13 y 14 de la plantilla (en el punto donde se necesita o en el cierre).
#   Tipos: requisito | siguiente | alternativa | concepto | incidencia | tarea (desde una pregunta: dónde se hace).
#   Las preguntas del tema ya salen en el cierre (bloque faq-<tema>); aquí solo se anotan si además deben
#   enlazarse en el punto donde surge la duda. «También te puede interesar» lleva como máximo tres enlaces;
#   ese límite no afecta a los enlaces del texto.
# variables: las del catálogo previstas para la página en la versión 1 (incluye variables no creadas).
#
# Qué describe cada campo (validar.py no lee este fichero):
#  - Comprobable en help-center: estado de bloques y variables (existe / creada / no creada / pospuesta).
#  - Previsto (plan o intención, no comprobado): relaciones (qué debe enlazar la página); variables de las
#    páginas; valor de las variables no creadas o pospuestas; uso previsto de un bloque.
#  - Procedencia y contexto: origen, contenido y notas. Los pendientes de contenido están en pendientes.yaml.
#
# Estado: versión 1 validada por Sergio el 01/10/2026 (secciones, fusiones, bloques y variables), con valores
# pendientes de negocio identificados en pendientes.yaml. Criterios: reglas 13 a 16 de la plantilla de tarea.

# Bloques reutilizables (.gitbook/includes). Cuándo se usan: regla 15 del documento maestro.
# Catálogo de todos los bloques salvo los faq-<tema>, que genera generar_faq.py. «estado» recoge la revisión de
# su texto (sin responsable asignado todavía); los valores y canales por confirmar están en pendientes.yaml.
bloques:
  abrir-solicitud-prestacion:
    contenido: aviso «no disponible en la App, usa la web desde el móvil» y las dos formas de abrir una solicitud (Tus gestiones digitales o Prestaciones económicas)
    origen: [P19, P27, P57]
  canal-chat:
    contenido: para qué es el chat (solo dudas médicas, ligado a un episodio, no urgencias, respuesta en horario laboral)
    origen: [P02, P38, P77, P80]
  contacto-tramitador:
    contenido: dónde ves el correo y el teléfono de tu tramitador/a (en tu solicitud) y su horario
    origen: [P21, P34, P80]
    estado: prueba (01/10)
  rel-tipos-certificacion:
    contenido: tabla negativa / positiva / positiva diferida → qué significa → cuándo puedes finalizar la solicitud
    origen: [P29, P60, P61, P64]
  autoliquidacion-requisitos:
    contenido: las cuatro condiciones (prestación activa, días de espera, sin embargos, último parte de confirmación) y qué pasa si no se cumplen
    origen: [P34, P67, P70, P71, P72]
    estado: prueba (01/10)
  # Definiciones que se repiten en su página y en el glosario: si el resumen debe cambiar con la página,
  # es texto compartido (propuesta). Un bloque no cabe en una celda de tabla: la presentación del glosario
  # completo se decide al trabajar esa página.
  def-segunda-opinion:
    contenido: definición breve de la segunda opinión médica
    origen: [P49, P81]
  def-autoliquidacion:
    contenido: definición breve de la autoliquidación
    origen: [P67, P81]
    estado: prueba (01/10)
  def-certificacion-riesgo:
    contenido: definición breve de la certificación de riesgo
    origen: [P60, P81]
  def-pago-directo:
    contenido: definición breve del pago directo
    origen: [P58, P81]
  # Existentes
  aviso-cambio-cita: {contenido: "solo el canal para cambiar una cita (02/10, sin aviso ni «No», para no repetir la respuesta)", nota: "texto pendiente de validar el canal; la tarea de citas lleva su propio aviso, que enlaza a la pregunta"}
  limites-asistente:
    contenido: qué puede y qué no puede hacer el asistente
    uso: portada y páginas con botón de asistente
    estado: borrador
  aviso-datos-salud:
    contenido: aviso de que la historia clínica, los informes y las pruebas son datos de salud protegidos; no compartir credenciales y cerrar la sesión
    uso: páginas o portadas de grupo que muestran datos de salud
    estado: borrador

# Variables de sección (.gitbook/vars.yaml). Cuándo se usan: regla 16 del documento maestro.
# valor: solo en las no creadas o pospuestas; el de las creadas está en help-center/.gitbook/vars.yaml, que manda.
variables:
  portal_url: {origen: 15 páginas, estado: "existe; no sirve para la dirección de un enlace (prueba del 02/10): los enlaces llevan la dirección escrita"}
  telefono_atencion: {origen: [P02, P41, P80], estado: existe}
  autoliquidacion_espera: {origen: [P34, P67, P70, P71, P72], estado: "creada en la prueba (01/10), provisional"}
  autoliquidacion_plazo_abono: {origen: [P34, P67, P70, P71], nota: P34 dice también «1-2 días», estado: "creada en la prueba (01/10), provisional"}
  rel_dias_finalizar: {origen: [P29, P30, P60, P61, P64], estado: creada en el borrador (01/10)}
  red_centros_url: {valor: "https://www.ibermutua.es/redcentros/", origen: [P14, P45, P81], nota: P14 usa /red-de-centros/, estado: "no creada: GitBook no admite variables en la dirección de un enlace (prueba del 02/10)"}
  portal_empresas_url: {valor: "https://empresas.ibermutua.es/", origen: [P22, P28], estado: "no creada: GitBook no admite variables en la dirección de un enlace (prueba del 02/10)"}
  portal_digital_url: {valor: "https://digital.ibermutua.es/", origen: [P22, P28], estado: "no creada: GitBook no admite variables en la dirección de un enlace (prueba del 02/10)"}
  rel_lactancia_semana: {origen: [P32], estado: creada el 02/10 (sin verificar; ver pendientes)}
  rel_lactancia_semana_multiple: {origen: [P32], nota: embarazo múltiple, estado: creada el 02/10 (sin verificar; ver pendientes)}
  menu_gestiones: {valor: "Tus gestiones digitales", origen: [P02, P09, P16, P19, P27, P34, P37, P38, P55], estado: "pospuesta (si la app usa otro nombre, puede haber una variable solo para la web)"}

