# Mapa de contenido de la sección Personas: las 82 páginas de Confluence y su destino en GitBook
#
# Es el plan de migración. Una entrada por página nueva, con los mismos campos que
# indice-contenido.yaml para pasarla tal cual al índice cuando la página se migre.
# Las páginas ya migradas (en_indice: true) solo llevan aquí origen y relaciones: sus temas y
# su faq_tema están en el índice, que es la fuente.
#
# origen: páginas de Confluence (Pnn = orden de extracciones/…/indice.md). La primera es la
#   principal; las demás se fusionan o se redirigen a esta página (ver correspondencia.csv).
# tipo: portada | tarea | concepto | pregunta | referencia
# temas / faq_tema: igual que en el índice (el bloque faq-<tema> que muestra la tarea).
# relaciones: qué otras páginas debe enlazar esta y por qué. No dicen dónde va el enlace: lo decide
#   la redacción con las reglas 13 y 14 de la plantilla (en el punto donde se necesita o en el cierre).
#   Tipos: requisito | siguiente | alternativa | concepto | incidencia | tarea (desde una pregunta: dónde se hace).
#   Las preguntas del tema ya salen en el cierre (bloque faq-<tema>); aquí solo se anotan si además deben
#   enlazarse en el punto donde surge la duda. «También te puede interesar» lleva como máximo tres enlaces;
#   ese límite no afecta a los enlaces del texto.
# bloques / variables: los del catálogo de abajo que usa la página (reglas 15 y 16).
#
# Estado: propuesta del 01/10/2026, pendiente de validar; criterios ajustados a las reglas 13 a 16 el mismo día.
# No cambia ninguna página.

temas_nuevos:
  acceso: Alta y acceso
  prestaciones: Prestaciones económicas
  pago-directo: Pago directo
  rel: Riesgo durante el embarazo o la lactancia
  pagos: Pagos y retenciones
  autoliquidacion: Autoliquidación
  chat: Chat con el servicio médico
  videoconsulta: Videoconsulta
  rehabilitacion: Rehabilitación online

# Bloques reutilizables (.gitbook/includes). Regla 15: explicación breve que el lector necesita leer en ese punto
# y que debe ser igual en varias páginas. Puede ir en un paso, junto a una opción o en un aviso.
bloques:
  abrir-solicitud-prestacion:
    contenido: aviso «no disponible en la App, usa la web desde el móvil» y las dos formas de abrir una solicitud (Tus gestiones digitales o Prestaciones económicas)
    origen: [P19, P27, P57]
    usado_en: [prestaciones/pago-directo/solicitar-el-pago-directo.md, prestaciones/riesgo-embarazo-lactancia/iniciar-la-solicitud.md, preguntas-frecuentes/que-prestaciones-puedo-pedir.md]
  canal-chat:
    contenido: para qué es el chat (solo dudas médicas, ligado a un episodio, no urgencias, respuesta en horario laboral)
    origen: [P02, P38, P77, P80]
    usado_en: [servicios-digitales/chat-con-el-servicio-medico.md, canales-de-atencion.md, preguntas-frecuentes/cuando-responden-el-chat.md]
  contacto-tramitador:
    contenido: dónde ves el correo y el teléfono de tu tramitador/a (en tu solicitud) y su horario
    origen: [P21, P34, P80]
    usado_en: [prestaciones/pago-directo/consultar-el-estado.md, prestaciones/solicitar-la-autoliquidacion.md, prestaciones/reclamar-una-resolucion.md, canales-de-atencion.md]
  rel-tipos-certificacion:
    contenido: tabla negativa / positiva / positiva diferida → qué significa → cuándo puedes finalizar la solicitud
    origen: [P29, P60, P61, P64]
    usado_en: [prestaciones/riesgo-embarazo-lactancia/certificacion-de-riesgo.md, prestaciones/riesgo-embarazo-lactancia/finalizar-la-solicitud.md, preguntas-frecuentes/que-es-la-certificacion-de-riesgo.md, preguntas-frecuentes/cuando-puedo-finalizar-la-solicitud.md]
  autoliquidacion-requisitos:
    contenido: las cuatro condiciones (prestación activa, días de espera, sin embargos, último parte de confirmación) y qué pasa si no se cumplen
    origen: [P34, P67, P70, P71, P72]
    usado_en: [prestaciones/solicitar-la-autoliquidacion.md, preguntas-frecuentes/que-es-la-autoliquidacion.md, preguntas-frecuentes/aprobacion-de-la-autoliquidacion.md, preguntas-frecuentes/no-puedo-solicitar-la-autoliquidacion.md]
  # Definiciones que se repiten en su página y en el glosario: si el resumen debe cambiar con la página,
  # es texto compartido. Un bloque no cabe en una celda de tabla: esas entradas del glosario van fuera de la tabla.
  def-segunda-opinion:
    contenido: definición breve de la segunda opinión médica
    origen: [P49, P81]
    usado_en: [preguntas-frecuentes/que-es-la-segunda-opinion.md, glosario.md]
  def-autoliquidacion:
    contenido: definición breve de la autoliquidación
    origen: [P67, P81]
    usado_en: [preguntas-frecuentes/que-es-la-autoliquidacion.md, glosario.md]
  def-certificacion-riesgo:
    contenido: definición breve de la certificación de riesgo
    origen: [P60, P81]
    usado_en: [preguntas-frecuentes/que-es-la-certificacion-de-riesgo.md, glosario.md]
  def-pago-directo:
    contenido: definición breve del pago directo
    origen: [P58, P81]
    usado_en: [preguntas-frecuentes/que-es-el-pago-directo.md, glosario.md]
  # Existentes
  aviso-cambio-cita: {usado_en: [citas-y-asistencias/consultar-tus-citas.md, preguntas-frecuentes/cambiar-una-cita.md], nota: texto pendiente de validar el canal}
  contacto: {nota: se retira de las páginas (contacto en la navegación); su contenido pasa a canales-de-atencion.md con canal-chat y contacto-tramitador}

# Variables de sección (.gitbook/vars.yaml). Regla 16: un mismo dato, con el mismo significado, en frases distintas,
# también dentro de los bloques. Se comparte porque significa lo mismo, no porque coincida (autoliquidacion_espera y
# rel_dias_finalizar valen 7 días y son distintas). La condición se escribe completa; solo el valor sale de la variable.
# No funcionan en títulos: los títulos no llevan datos.
variables:
  portal_url: {valor: "https://personas.ibermutua.es/", origen: 15 páginas, estado: existe}
  telefono_atencion: {valor: "900 23 33 33", origen: [P02, P41, P80], estado: existe}
  autoliquidacion_espera: {valor: "7 días", origen: [P34, P67, P70, P71, P72]}
  autoliquidacion_plazo_abono: {valor: "2 días laborables", origen: [P34, P67, P70, P71], nota: P34 dice también «1-2 días»}
  rel_dias_finalizar: {valor: "7 días", origen: [P29, P30, P60, P61, P64]}
  red_centros_url: {valor: "https://www.ibermutua.es/redcentros/", origen: [P14, P45, P81], nota: P14 usa /red-de-centros/}
  portal_empresas_url: {valor: "https://empresas.ibermutua.es/", origen: [P22, P28]}
  portal_digital_url: {valor: "https://digital.ibermutua.es/", origen: [P22, P28]}
  menu_gestiones: {valor: "Tus gestiones digitales", origen: [P02, P09, P16, P19, P27, P34, P37, P38, P55], estado: a decidir (etiqueta de la interfaz más repetida)}

